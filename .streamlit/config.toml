[theme]
base = "light"
primaryColor = "#137C68"
backgroundColor = "#F7FAF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2B27"
borderColor = "#DFE9E4"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["38px", "30px", "24px", "20px", "17px", "15px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
chartCategoricalColors = ["#137C68", "#315F83", "#BB7D39", "#8B6A9F", "#59917D", "#B45E57", "#677C8F", "#859A59"]

[theme.sidebar]
backgroundColor = "#EFF5F1"
secondaryBackgroundColor = "#E6EFEA"
textColor = "#1D2B27"
borderColor = "#D7E4DC"
primaryColor = "#137C68"
